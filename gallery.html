<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <meta
    name="description"
    content="Lumonere Studio Photo Gallery"
  >

  <title>Lumonere Studio Gallery</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      background: #080808;
    }


    body {

      margin: 0;

      background:
        radial-gradient(
          circle at top,
          #202020 0%,
          #0d0d0d 45%,
          #080808 100%
        );

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      min-height: 100vh;

    }


    /* =========================
       PAGE
    ========================= */

    .gallery-page {

      width: 100%;

      max-width: 1100px;

      margin: 0 auto;

      padding:
        28px 18px 60px;

    }


    /* =========================
       HEADER
    ========================= */

    .gallery-header {

      text-align: center;

      margin-bottom: 30px;

    }


    .brand {

      font-size: 13px;

      letter-spacing: 4px;

      font-weight: 600;

      opacity: .65;

      text-transform: uppercase;

      margin-bottom: 10px;

    }


    .gallery-title {

      margin: 0;

      font-size:
        clamp(
          28px,
          7vw,
          48px
        );

      font-weight: 700;

      letter-spacing: -1px;

    }


    .gallery-title span {

      font-weight: 300;

    }


    .client-name {

      margin:
        12px 0 4px;

      font-size: 20px;

      font-weight: 500;

    }


    .event-name {

      margin: 0;

      opacity: .65;

      font-size: 14px;

    }


    .event-date {

      margin:
        8px 0 0;

      opacity: .5;

      font-size: 13px;

    }


    /* =========================
       PHOTO GRID
    ========================= */

    .photo-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-top: 20px;

    }


    .photo-card {

      position: relative;

      overflow: hidden;

      border-radius: 10px;

      background: #151515;

      aspect-ratio: 1 / 1;

      cursor: pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease;

    }


    .photo-card:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.35);

    }


    .photo-card img {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

      /*
       * Important:
       * Don't blur the image with browser smoothing
       * more than necessary.
       */

      image-rendering: auto;

      transition:
        transform .3s ease;

    }


    .photo-card:hover img {

      transform:
        scale(1.04);

    }


    /* =========================
       LOADING
    ========================= */

    .loading {

      text-align: center;

      padding: 80px 20px;

      opacity: .7;

    }


    .spinner {

      width: 34px;

      height: 34px;

      border:
        3px solid
        rgba(255,255,255,.15);

      border-top-color:
        #fff;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

      margin:
        0 auto 18px;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

      text-align: center;

      padding: 80px 20px;

    }


    .message-icon {

      font-size: 42px;

      margin-bottom: 15px;

    }


    .message h2 {

      margin:
        0 0 8px;

      font-size: 24px;

    }


    .message p {

      margin: 0;

      opacity: .55;

      font-size: 14px;

    }


    /* =========================
       DRIVE BUTTON
    ========================= */

    .drive-button {

      display: inline-block;

      margin-top: 20px;

      background: #fff;

      color: #000;

      text-decoration: none;

      padding:
        12px 22px;

      border-radius: 30px;

      font-size: 14px;

      font-weight: 600;

      transition:
        transform .2s ease,
        opacity .2s ease;

    }


    .drive-button:hover {

      transform:
        translateY(-2px);

      opacity: .85;

    }


    /* =========================
       LIGHTBOX
    ========================= */

    .lightbox {

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.94);

      display: none;

      align-items: center;

      justify-content: center;

      z-index: 9999;

      padding: 20px;

    }


    .lightbox.active {

      display: flex;

    }


    .lightbox-image {

      max-width: 95vw;

      max-height: 85vh;

      width: auto;

      height: auto;

      object-fit: contain;

      border-radius: 6px;

      display: block;

    }


    .lightbox-close {

      position: fixed;

      top: 18px;

      right: 20px;

      width: 42px;

      height: 42px;

      border: 0;

      border-radius: 50%;

      background:
        rgba(255,255,255,.12);

      color: white;

      font-size: 25px;

      cursor: pointer;

      z-index: 10000;

    }


    .lightbox-nav {

      position: fixed;

      top: 50%;

      transform: translateY(-50%);

      width: 48px;

      height: 48px;

      border: 0;

      border-radius: 50%;

      background: rgba(255,255,255,.12);

      color: white;

      font-size: 38px;

      line-height: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 0 0 4px;

      cursor: pointer;

      z-index: 10000;

      transition:
        background .2s ease,
        opacity .2s ease,
        transform .2s ease;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

    }


    .lightbox-nav:hover {

      background: rgba(255,255,255,.22);

    }


    .lightbox-prev {

      left: 18px;

    }


    .lightbox-next {

      right: 18px;

    }


    .lightbox-nav.hidden {

      display: none;

    }


    .lightbox-counter {

      position: fixed;

      top: 18px;

      left: 50%;

      transform: translateX(-50%);

      min-width: 58px;

      padding: 7px 12px;

      border-radius: 30px;

      background: rgba(255,255,255,.10);

      color: rgba(255,255,255,.82);

      font-size: 12px;

      letter-spacing: .5px;

      text-align: center;

      z-index: 10000;

      pointer-events: none;

    }


    .lightbox-download {

      position: fixed;

      bottom: 22px;

      left: 50%;

      transform:
        translateX(-50%);

      background: white;

      color: black;

      text-decoration: none;

      padding:
        12px 22px;

      border-radius: 30px;

      font-size: 14px;

      font-weight: 600;

      z-index: 10000;

    }


    /* =========================
       FOOTER
    ========================= */

    .gallery-footer {

      text-align: center;

      margin-top: 45px;

      opacity: .35;

      font-size: 12px;

      letter-spacing: .5px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .gallery-page {

        padding:
          22px 10px 45px;

      }


      .photo-grid {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 7px;

      }


      .photo-card {

        border-radius: 7px;

      }


      .gallery-title {

        font-size: 32px;

      }


      .lightbox {

        padding: 10px;

      }


      .lightbox-image {

        max-width: 96vw;

        max-height: 82vh;

        touch-action: pan-y pinch-zoom;

      }


      .lightbox-nav {

        width: 42px;

        height: 42px;

        font-size: 32px;

      }


      .lightbox-prev {

        left: 8px;

      }


      .lightbox-next {

        right: 8px;

      }


      .lightbox-counter {

        top: 12px;

        font-size: 11px;

      }

    }

  </style>

</head>


<body>


  <main class="gallery-page">


    <!-- =========================
         HEADER
    ========================= -->

    <header class="gallery-header">

      <div class="brand">
        LUMONERE STUDIO
      </div>


      <h1 class="gallery-title">
        PHOTO <span>GALLERY</span>
      </h1>


      <div id="gallery-info"></div>

    </header>


    <!-- =========================
         GALLERY CONTENT
    ========================= -->

    <section id="gallery-content">

      <div class="loading">

        <div class="spinner"></div>

        <div>
          Loading your gallery...
        </div>

      </div>

    </section>


    <footer class="gallery-footer">

      Making Your Moments Photo Worthy.

    </footer>


  </main>


  <!-- =========================
       LIGHTBOX
  ========================= -->

  <div
    id="lightbox"
    class="lightbox"
    aria-hidden="true"
  >

    <button
      id="lightbox-close"
      class="lightbox-close"
      aria-label="Close"
    >
      ×
    </button>


    <button
      id="lightbox-prev"
      class="lightbox-nav lightbox-prev"
      aria-label="Previous photo"
      type="button"
    >
      ‹
    </button>


    <img
      id="lightbox-image"
      class="lightbox-image"
      src=""
      alt="Gallery photo"
    >


    <button
      id="lightbox-next"
      class="lightbox-nav lightbox-next"
      aria-label="Next photo"
      type="button"
    >
      ›
    </button>


    <div
      id="lightbox-counter"
      class="lightbox-counter"
      aria-live="polite"
    ></div>


    <a
      id="lightbox-download"
      class="lightbox-download"
      href=""
      target="_blank"
      rel="noopener noreferrer"
      download
    >
      Download Photo
    </a>

  </div>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    /* =====================================================
       SUPABASE CONFIG
    ===================================================== */

    const SUPABASE_URL =
      "https://xlwcxuicdveqaxeeqawv.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_BrEK961qCBTmXCuMeKcK7w_lXQTTFCL";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    console.log(
      "Lumonere Studio Supabase connected"
    );


    /* =====================================================
       EDGE FUNCTION
    ===================================================== */

    const DRIVE_FUNCTION =
      "get-gallery-photos";


    /* =====================================================
       GET GALLERY CODE
    ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const galleryCode =
      params.get("code");


    /* =====================================================
       DOWNLOAD / SCROLL POSITION MEMORY

       Some mobile browsers ignore target="_blank" / download
       for Google Drive files and may navigate or reload the
       current page. Save the user's album position so the
       gallery can return to the same spot after that happens.
    ===================================================== */

    history.scrollRestoration = "manual";

    const GALLERY_STATE_KEY =
      "lumonere_gallery_state_" + (galleryCode || "none");

    function saveGalleryPosition() {
      try {
        sessionStorage.setItem(
          GALLERY_STATE_KEY,
          JSON.stringify({
            scrollY: window.scrollY || window.pageYOffset || 0
          })
        );
      } catch (error) {
        console.warn("Unable to save gallery position:", error);
      }
    }

    function restoreGalleryPosition() {
      try {
        const saved = sessionStorage.getItem(GALLERY_STATE_KEY);

        if (!saved) {
          return;
        }

        const state = JSON.parse(saved);
        const scrollY = Number(state?.scrollY);

        if (!Number.isFinite(scrollY) || scrollY < 0) {
          return;
        }

        // Wait until the photo grid has been inserted into the page.
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            window.scrollTo({
              top: scrollY,
              left: 0,
              behavior: "auto"
            });
          });
        });
      } catch (error) {
        console.warn("Unable to restore gallery position:", error);
      }
    }

    window.addEventListener(
      "beforeunload",
      saveGalleryPosition
    );


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const galleryInfo =
      document.getElementById(
        "gallery-info"
      );


    const galleryContent =
      document.getElementById(
        "gallery-content"
      );


    const lightbox =
      document.getElementById(
        "lightbox"
      );


    const lightboxImage =
      document.getElementById(
        "lightbox-image"
      );


    const lightboxDownload =
      document.getElementById(
        "lightbox-download"
      );


    const lightboxClose =
      document.getElementById(
        "lightbox-close"
      );


    const lightboxPrev =
      document.getElementById(
        "lightbox-prev"
      );


    const lightboxNext =
      document.getElementById(
        "lightbox-next"
      );


    const lightboxCounter =
      document.getElementById(
        "lightbox-counter"
      );


    let lightboxFiles = [];

    let currentPhotoIndex = -1;

    let touchStartX = 0;

    let touchStartY = 0;

    let touchStartTime = 0;


    /* =====================================================
       SHOW MESSAGE
    ===================================================== */

    function showMessage(
      title,
      text,
      icon = "📷"
    ) {

      galleryContent.innerHTML = `

        <div class="message">

          <div class="message-icon">
            ${icon}
          </div>

          <h2>
            ${escapeHtml(title)}
          </h2>

          <p>
            ${escapeHtml(text)}
          </p>

        </div>

      `;

    }


    /* =====================================================
       SUPABASE RPC
    ===================================================== */

    async function getGalleryFromSupabase(
      code
    ) {

      const rpcPromise =
        supabaseClient
          .rpc(
            "get_gallery_by_code",
            {
              p_code: code
            }
          );


      const timeoutPromise =
        new Promise(
          function(_, reject) {

            setTimeout(
              function() {

                reject(
                  new Error(
                    "Supabase request timed out."
                  )
                );

              },
              8000
            );

          }
        );


      return await Promise.race([
        rpcPromise,
        timeoutPromise
      ]);

    }


    /* =====================================================
       LOAD GALLERY
    ===================================================== */

    async function loadGallery() {

      if (!galleryCode) {

        showMessage(
          "Gallery Code Required",
          "Please open your Lumonere Studio gallery link.",
          "🔐"
        );

        return;

      }


      console.log(
        "Loading gallery code:",
        galleryCode
      );


      galleryContent.innerHTML = `

        <div class="loading">

          <div class="spinner"></div>

          <div>
            Loading your gallery...
          </div>

        </div>

      `;


      try {

        const result =
          await getGalleryFromSupabase(
            galleryCode
          );


        const data =
          result?.data;


        const error =
          result?.error;


        console.log(
          "Supabase DATA:",
          data
        );


        console.log(
          "Supabase ERROR:",
          error
        );


        if (error) {

          console.error(
            "Supabase RPC error:",
            error
          );


          showMessage(
            "Unable to Load Gallery",
            "There was a problem checking this gallery code.",
            "⚠️"
          );

          return;

        }


        if (
          !data ||
          !Array.isArray(data) ||
          data.length === 0
        ) {

          showMessage(
            "Gallery Not Found",
            "Please check your gallery code.",
            "🔍"
          );

          return;

        }


        const gallery =
          data[0];


        /* =========================
           ACTIVE CHECK
        ========================= */

        if (
          gallery.active === false
        ) {

          showMessage(
            "Gallery Unavailable",
            "This gallery is currently inactive.",
            "🔒"
          );

          return;

        }


        /* =========================
           EXPIRATION CHECK
        ========================= */

        if (
          gallery.expires_at
        ) {

          const expiration =
            new Date(
              gallery.expires_at
            );


          if (
            !Number.isNaN(
              expiration.getTime()
            ) &&
            expiration < new Date()
          ) {

            showMessage(
              "Gallery Expired",
              "This gallery is no longer available.",
              "⏰"
            );

            return;

          }

        }


        /* =========================
           GALLERY INFORMATION
        ========================= */

        galleryInfo.innerHTML = `

          <div class="client-name">

            ${escapeHtml(
              gallery.client_name
            )}

          </div>


          <div class="event-name">

            ${escapeHtml(
              gallery.event_name
            )}

          </div>


          ${
            gallery.event_date
              ? `

                <div class="event-date">

                  ${formatDate(
                    gallery.event_date
                  )}

                </div>

              `
              : ""
          }

        `;


        /* =========================
           LOAD PHOTOS
        ========================= */

        await loadDrivePhotos(
          gallery
        );

      }


      catch (error) {

        console.error(
          "Gallery loading error:",
          error
        );


        if (
          error &&
          error.message ===
          "Supabase request timed out."
        ) {

          showMessage(
            "Connection Timeout",
            "The gallery server took too long to respond. Please refresh and try again.",
            "⏳"
          );

          return;

        }


        showMessage(
          "Something Went Wrong",
          "We couldn't load this gallery. Please try again.",
          "⚠️"
        );

      }

    }


    /* =====================================================
       GET DRIVE FOLDER ID
    ===================================================== */

    function getDriveFolderId(
      driveUrl
    ) {

      if (!driveUrl) {

        return null;

      }


      const match =
        driveUrl.match(
          /\/folders\/([a-zA-Z0-9_-]+)/
        );


      if (!match) {

        return null;

      }


      return match[1];

    }


    /* =====================================================
       LOAD DRIVE PHOTOS
       
       NO GOOGLE API KEY HERE.
       
       The Edge Function handles
       Google Drive API securely.
    ===================================================== */

    async function loadDrivePhotos(
      gallery
    ) {

      const folderId =
        getDriveFolderId(
          gallery.drive_url
        );


      console.log(
        "Google Drive Folder ID:",
        folderId
      );


      if (!folderId) {

        showMessage(
          "Gallery Error",
          "We couldn't determine the Google Drive folder.",
          "⚠️"
        );

        return;

      }


      galleryContent.innerHTML = `

        <div class="loading">

          <div class="spinner"></div>

          <div>
            Loading your photos...
          </div>

        </div>

      `;


      try {

        console.log(
          "Calling Edge Function:",
          DRIVE_FUNCTION
        );


        /*
         * IMPORTANT:
         *
         * Edge Function expects:
         *
         * body.folderId
         */

        const {
          data,
          error
        } =
          await supabaseClient
            .functions
            .invoke(
              DRIVE_FUNCTION,
              {
                body: {
                  folderId:
                    folderId
                }
              }
            );


        console.log(
          "Edge Function DATA:",
          data
        );


        console.log(
          "Edge Function ERROR:",
          error
        );


        if (error) {

          console.error(
            "Edge Function error:",
            error
          );


          throw new Error(
            error.message ||
            "Unable to connect to the gallery photo service."
          );

        }


        /*
         * Edge Function returns:
         *
         * {
         *   files: [...]
         * }
         */

        let files = [];


        if (
          Array.isArray(data)
        ) {

          files =
            data;

        }


        else if (
          Array.isArray(
            data?.files
          )
        ) {

          files =
            data.files;

        }


        else if (
          Array.isArray(
            data?.photos
          )
        ) {

          files =
            data.photos;

        }


        else if (
          Array.isArray(
            data?.data
          )
        ) {

          files =
            data.data;

        }


        console.log(
          "Gallery files:",
          files
        );


        if (
          !files ||
          files.length === 0
        ) {

          showMessage(
            "No Photos Yet",
            "Your photos are not available yet.",
            "📷"
          );

          return;

        }


        renderPhotos(
          files,
          gallery.drive_url
        );

      }


      catch (error) {

        console.error(
          "Google Drive loading error:",
          error
        );


        showMessage(
          "Unable to Load Photos",
          error?.message ||
          "We couldn't load the photos from Google Drive.",
          "⚠️"
        );

      }

    }


    /* =====================================================
       HIGH RESOLUTION DRIVE THUMBNAIL
       
       THIS IS THE IMPORTANT CHANGE.
       
       We no longer prioritize thumbnailLink.
       We first request a large thumbnail directly
       from Google Drive using the file ID.
    ===================================================== */

    function getHighResolutionThumbnail(
      file
    ) {

      if (
        file.id
      ) {

        return (
          "https://drive.google.com/thumbnail" +
          "?id=" +
          encodeURIComponent(
            file.id
          ) +
          "&sz=w2000"
        );

      }


      return "";

    }


    /* =====================================================
       GET IMAGE URL
    ===================================================== */

    function getImageUrl(
      file
    ) {

      /*
       * FIRST:
       * High-resolution Drive thumbnail.
       */

      const highRes =
        getHighResolutionThumbnail(
          file
        );


      if (
        highRes
      ) {

        return highRes;

      }


      /*
       * SECOND:
       * Google API thumbnailLink.
       */

      if (
        file.thumbnailLink
      ) {

        const thumbnail =
          String(
            file.thumbnailLink
          );


        /*
         * Try to increase the size
         * of Google's generated thumbnail.
         */

        const largerThumbnail =
          thumbnail.replace(
            /=s\d+$/,
            "=s2000"
          );


        return largerThumbnail;

      }


      /*
       * Other possible formats.
       */

      if (
        file.thumbnail_url
      ) {

        return file.thumbnail_url;

      }


      if (
        file.thumbnailUrl
      ) {

        return file.thumbnailUrl;

      }


      if (
        file.image_url
      ) {

        return file.image_url;

      }


      if (
        file.imageUrl
      ) {

        return file.imageUrl;

      }


      if (
        file.url
      ) {

        return file.url;

      }


      return "";

    }


    /* =====================================================
       GET DOWNLOAD URL
    ===================================================== */

    function getDownloadUrl(
      file
    ) {

      if (
        file.webContentLink
      ) {

        return file.webContentLink;

      }


      if (
        file.download_url
      ) {

        return file.download_url;

      }


      if (
        file.downloadUrl
      ) {

        return file.downloadUrl;

      }


      if (
        file.url
      ) {

        return file.url;

      }


      if (
        file.id
      ) {

        return (
          "https://drive.google.com/uc" +
          "?export=download&id=" +
          encodeURIComponent(
            file.id
          )
        );

      }


      return "";

    }


    /* =====================================================
       GET LARGE IMAGE URL
       
       Used by the lightbox.
    ===================================================== */

    function getLargeImageUrl(
      file
    ) {

      /*
       * Use a very large Drive thumbnail.
       */

      if (
        file.id
      ) {

        return (
          "https://drive.google.com/thumbnail" +
          "?id=" +
          encodeURIComponent(
            file.id
          ) +
          "&sz=w3000"
        );

      }


      /*
       * Fallback to thumbnailLink.
       */

      if (
        file.thumbnailLink
      ) {

        const thumbnail =
          String(
            file.thumbnailLink
          );


        const largerThumbnail =
          thumbnail.replace(
            /=s\d+$/,
            "=s3000"
          );


        return largerThumbnail;

      }


      if (
        file.full_url
      ) {

        return file.full_url;

      }


      if (
        file.fullUrl
      ) {

        return file.fullUrl;

      }


      if (
        file.image_url
      ) {

        return file.image_url;

      }


      if (
        file.imageUrl
      ) {

        return file.imageUrl;

      }


      if (
        file.url
      ) {

        return file.url;

      }


      return getImageUrl(
        file
      );

    }


    /* =====================================================
       RENDER PHOTOS
    ===================================================== */

    function renderPhotos(
      files,
      driveUrl
    ) {

      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "photo-grid";


      lightboxFiles = files.slice();

      files.forEach(
        function(file, index) {

          const imageUrl =
            getImageUrl(
              file
            );


          if (!imageUrl) {

            return;

          }


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "photo-card";


          const image =
            document.createElement(
              "img"
            );


          image.loading =
            "lazy";


          image.decoding =
            "async";


          image.alt =
            file.name ||
            "Lumonere Studio photo";


          image.src =
            imageUrl;


          /*
           * If the high-resolution Drive
           * thumbnail fails, fall back
           * to Google's thumbnailLink.
           */

          image.onerror =
            function() {

              if (
                image.dataset.fallbackUsed
              ) {

                return;

              }


              let fallback =
                "";


              if (
                file.thumbnailLink
              ) {

                const thumbnail =
                  String(
                    file.thumbnailLink
                  );


                fallback =
                  thumbnail.replace(
                    /=s\d+$/,
                    "=s2000"
                  );

              }


              if (
                !fallback &&
                file.webContentLink
              ) {

                fallback =
                  file.webContentLink;

              }


              if (
                !fallback ||
                fallback === image.src
              ) {

                return;

              }


              image.dataset.fallbackUsed =
                "true";


              image.src =
                fallback;

            };


          card.appendChild(
            image
          );


          card.addEventListener(
            "click",
            function() {

              openLightbox(
                index
              );

            }
          );


          grid.appendChild(
            card
          );

        }
      );


      galleryContent.innerHTML =
        "";


      if (
        grid.children.length === 0
      ) {

        showMessage(
          "No Photos Available",
          "The gallery service returned no usable photos.",
          "📷"
        );

        return;

      }


      galleryContent.appendChild(
        grid
      );

      // If a download caused a page navigation/reload, return
      // the visitor to the same position in the album.
      restoreGalleryPosition();


      /*
       * Google Drive button
       */

      if (
        driveUrl
      ) {

        const driveButton =
          document.createElement(
            "div"
          );


        driveButton.style.textAlign =
          "center";


        driveButton.innerHTML = `

          <a
            class="drive-button"
            href="${escapeAttribute(
              driveUrl
            )}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open Google Drive
          </a>

        `;


        galleryContent.appendChild(
          driveButton
        );

      }

    }


    /* =====================================================
       OPEN LIGHTBOX

       Supports:
       - Previous / next buttons
       - Left / right swipe on mobile
       - Arrow keys on desktop
       - Photo counter
    ===================================================== */

    function openLightbox(
      index
    ) {

      if (
        !Array.isArray(lightboxFiles) ||
        lightboxFiles.length === 0
      ) {

        return;

      }


      const normalizedIndex =
        Math.max(
          0,
          Math.min(
            Number(index) || 0,
            lightboxFiles.length - 1
          )
        );


      currentPhotoIndex =
        normalizedIndex;


      updateLightboxPhoto();


      lightbox.classList.add(
        "active"
      );


      lightbox.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body.style.overflow =
        "hidden";

    }


    /* =====================================================
       UPDATE LIGHTBOX PHOTO
    ===================================================== */

    function updateLightboxPhoto() {

      const file =
        lightboxFiles[
          currentPhotoIndex
        ];


      if (!file) {

        return;

      }


      const imageUrl =
        getLargeImageUrl(
          file
        );


      const fallbackUrl =
        getImageUrl(
          file
        );


      const downloadUrl =
        getDownloadUrl(
          file
        );


      if (!imageUrl) {

        return;

      }


      lightboxImage.dataset.fallback =
        fallbackUrl || "";


      lightboxImage.dataset.fallbackUsed =
        "false";


      lightboxImage.src =
        imageUrl;


      lightboxImage.alt =
        file.name ||
        "Lumonere Studio photo";


      lightboxDownload.href =
        downloadUrl ||
        fallbackUrl ||
        imageUrl;


      lightboxCounter.textContent =
        (currentPhotoIndex + 1) +
        " / " +
        lightboxFiles.length;


      updateLightboxNavigation();

    }


    /* =====================================================
       LIGHTBOX NAVIGATION
    ===================================================== */

    function updateLightboxNavigation() {

      const hasMultiplePhotos =
        lightboxFiles.length > 1;


      lightboxPrev.classList.toggle(
        "hidden",
        !hasMultiplePhotos
      );


      lightboxNext.classList.toggle(
        "hidden",
        !hasMultiplePhotos
      );


      if (lightboxFiles.length <= 1) {

        return;

      }


      // Wrap around so the user can keep swiping continuously.
      lightboxPrev.disabled = false;
      lightboxNext.disabled = false;

    }


    function showPreviousPhoto() {

      if (lightboxFiles.length <= 1) {

        return;

      }


      currentPhotoIndex =
        (currentPhotoIndex - 1 + lightboxFiles.length) %
        lightboxFiles.length;


      updateLightboxPhoto();

    }


    function showNextPhoto() {

      if (lightboxFiles.length <= 1) {

        return;

      }


      currentPhotoIndex =
        (currentPhotoIndex + 1) %
        lightboxFiles.length;


      updateLightboxPhoto();

    }


    /* =====================================================
       CLOSE LIGHTBOX
    ===================================================== */

    function closeLightbox() {

      lightbox.classList.remove(
        "active"
      );


      lightbox.setAttribute(
        "aria-hidden",
        "true"
      );


      lightboxImage.src =
        "";


      lightboxDownload.href =
        "";


      lightboxCounter.textContent =
        "";


      currentPhotoIndex =
        -1;


      document.body.style.overflow =
        "";

    }


    /* =====================================================
       LIGHTBOX IMAGE FALLBACK
    ===================================================== */

    lightboxImage.addEventListener(
      "error",
      function() {

        const fallback =
          lightboxImage.dataset.fallback;


        if (
          !fallback ||
          lightboxImage.dataset.fallbackUsed ===
            "true" ||
          fallback ===
            lightboxImage.src
        ) {

          return;

        }


        lightboxImage.dataset.fallbackUsed =
          "true";


        lightboxImage.src =
          fallback;

      }
    );


    /* =====================================================
       LIGHTBOX EVENTS
    ===================================================== */

    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );


    lightboxPrev.addEventListener(
      "click",
      function(event) {
        event.stopPropagation();
        showPreviousPhoto();
      }
    );


    lightboxNext.addEventListener(
      "click",
      function(event) {
        event.stopPropagation();
        showNextPhoto();
      }
    );


    /* =====================================================
       TOUCH SWIPE

       Swipe left  -> next photo
       Swipe right -> previous photo
    ===================================================== */

    lightbox.addEventListener(
      "touchstart",
      function(event) {

        if (!lightbox.classList.contains("active")) {
          return;
        }

        const touch = event.changedTouches && event.changedTouches[0];

        if (!touch) {
          return;
        }

        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchStartTime = Date.now();

      },
      { passive: true }
    );


    lightbox.addEventListener(
      "touchend",
      function(event) {

        if (!lightbox.classList.contains("active")) {
          return;
        }

        const touch = event.changedTouches && event.changedTouches[0];

        if (!touch) {
          return;
        }

        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;
        const elapsed = Date.now() - touchStartTime;

        const minimumSwipeDistance = 55;
        const maxVerticalDrift = 90;
        const maximumSwipeTime = 700;

        if (
          elapsed <= maximumSwipeTime &&
          Math.abs(deltaX) >= minimumSwipeDistance &&
          Math.abs(deltaX) > Math.abs(deltaY) &&
          Math.abs(deltaY) <= maxVerticalDrift
        ) {

          if (deltaX < 0) {
            showNextPhoto();
          } else {
            showPreviousPhoto();
          }

          event.preventDefault();

        }

      },
      { passive: false }
    );


    /* =====================================================
       DOWNLOAD POSITION MEMORY

       Save the album position immediately before the browser
       handles the Google Drive download. This is especially
       useful on mobile browsers that reload the gallery page.
    ===================================================== */

    lightboxDownload.addEventListener(
      "click",
      function() {
        saveGalleryPosition();
      }
    );


    lightbox.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          lightbox
        ) {

          closeLightbox();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeLightbox();
          return;

        }


        if (
          !lightbox.classList.contains("active")
        ) {

          return;

        }


        if (event.key === "ArrowLeft") {

          event.preventDefault();
          showPreviousPhoto();

        }


        if (event.key === "ArrowRight") {

          event.preventDefault();
          showNextPhoto();

        }

      }
    );


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       ESCAPE ATTRIBUTE
    ===================================================== */

    function escapeAttribute(
      value
    ) {

      return escapeHtml(
        value
      );

    }


    /* =====================================================
       FORMAT DATE
    ===================================================== */

    function formatDate(
      date
    ) {

      const parsedDate =
        new Date(
          date
        );


      if (
        Number.isNaN(
          parsedDate.getTime()
        )
      ) {

        return "";

      }


      return parsedDate.toLocaleDateString(
        "en-PH",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

    }


    /* =====================================================
       START APPLICATION
    ===================================================== */

    loadGallery();


  </script>
